name: Integration Tests
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
jobs:
  test_integration:
    # Pinned to :next. jhnnsrs/alpaka does publish a :latest, but it predates the
    # `authentikate.audience` setting configs/alpaka.yaml relies on and refuses to
    # boot with it (`extra_forbidden`), so the previous 'main -> latest' expression
    # failed every integration run on the stable line. Restore the split once a
    # stable image that accepts the current config is published.
    env:
      ALPAKA_SERVICE_TAG: next
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -m integration
