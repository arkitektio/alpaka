services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:next
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: alpaka
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  alpaka:
    depends_on:
    - redis
    - db
    - rustfs
    image: jhnnsrs/alpaka:${ALPAKA_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - "${ALPAKA_HOST_PORT:-6888}:80"
    volumes:
    - ./configs/alpaka.yaml:/workspace/config.yaml
  chromadb:
    image: chromadb/chroma:latest
    environment:
        IS_PERSISTENT: "TRUE"
        ANONYMIZED_TELEMETRY: "TRUE"
  ollama:
    tty: true
    restart: unless-stopped
    image: ollama/ollama:latest
    environment:
        - OLLAMA_KEEP_ALIVE=24h
    labels:
        - fakts.service=io.ollama.ollama
        - fakts.builder=ollama.ollama
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: rustfs/rustfs:latest
    ports:
    - "${RUSTFS_HOST_PORT:-6889}:9000"
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: jhnnsrs/init:next
    volumes:
    - ./configs/rustfs.yaml:/workspace/config.yaml


