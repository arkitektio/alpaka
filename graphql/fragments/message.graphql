fragment Message on Message {
    id 
    text
    isStreaming
    agent {
        id
        name
        room {
            id
        }
    }
    room {
        id
        title
    }
    before {
        ...ListMessage
    }
    attachedStructures {
        object
        identifier
    }
}

fragment ListMessage on Message {
    id 
    text
    isStreaming
    agent {
        id
        name
    }
    attachedStructures {
        object
        identifier
    }
}