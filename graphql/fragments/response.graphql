fragment ChatResponse on ChatResponse {
  id
  object
  created
  model
  usage {
    promptTokens
    completionTokens
    totalTokens
  }
  choices {
    index
    finishReason
    reasoningContent
    thinkingBlocks {
      type
      thinking
      signature
    }
    message {
      role
      content
      name
      toolCallId
      functionCall {
        name
        arguments
      }
      toolCalls {
        id
        type
        function {
          name
          arguments
        }
      }
    }
  }
}