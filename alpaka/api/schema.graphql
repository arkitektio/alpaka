"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

"""A LLM model to chage with"""
type LLMModel {
  id: ID!
  modelId: String!
  label: String!
  provider: Provider!

  """The features supported by the model"""
  features: [FeatureType!]!

  """The collections that can be embedded with this model"""
  embedderFor(filters: ChromaCollectionFilter, ordering: [ChromaCollectionOrder!]! = [], pagination: OffsetPaginationInput): [ChromaCollection!]!

  """The string to use for the LLM model"""
  llmString: String!

  """The modalities this model accepts as input"""
  inputModalities: [Modality!]!

  """The modalities this model produces as output"""
  outputModalities: [Modality!]!
}

"""Filter for LLMModel"""
input LLMModelFilter {
  AND: LLMModelFilter
  OR: LLMModelFilter
  NOT: LLMModelFilter
  DISTINCT: Boolean
  ids: [ID!]
  search: String
  inputModalities: [Modality!]
  outputModalities: [Modality!]
  features: [FeatureType!]
  provider: ID
}

input LLMModelOrder @oneOf {
  label: Ordering
  modelId: Ordering
}

"""Message represent the message of an agent on a room"""
type Message @key(fields: "id", resolvable: true) {
  id: ID!

  """A clear text representation of the rich comment"""
  text: String!
  room: Room!

  """The user that created this comment"""
  agent: Agent!

  """The objects this message was posted about"""
  attachedStructures: [Structure!]!

  """The time this comment got created"""
  createdAt: DateTime!

  """Whether this message is still being written"""
  isStreaming: Boolean!

  """The message this one replies to, if any"""
  isReplyTo: Message

  """The messages replying to this one"""
  replies(filters: MessageFilter, ordering: [MessageOrder!]! = [], pagination: OffsetPaginationInput): [Message!]!

  """The agents this message is addressed to"""
  targets(filters: AgentFilter, ordering: [AgentOrder!]! = [], pagination: OffsetPaginationInput): [Agent!]!

  """The rich-text representation of the message"""
  descendants: JSON!
  before(filters: MessageFilter = null, pagination: OffsetPaginationInput = null): [Message!]!
  title: String!
}

"""Message represent the message of an agent on a room"""
input MessageFilter {
  AND: MessageFilter
  OR: MessageFilter
  NOT: MessageFilter
  DISTINCT: Boolean
  ids: [ID!]
  search: String
}

input MessageOrder @oneOf {
  createdAt: Ordering
}

"""A modality a model can read or emit"""
enum Modality {
  IMAGE
  TEXT
  AUDIO
  VIDEO
}

"""The root mutation type"""
type Mutation {
  """Open a new room"""
  createRoom(input: CreateRoomInput!): Room!

  """Delete a room and its messages"""
  deleteRoom(input: DeleteRoomInput!): ID!

  """Post a message into a room"""
  send(input: SendMessageInput!): Message!

  """Configure a new LLM provider and list the models it offers"""
  createProvider(input: ProviderInput!): Provider!

  """Update a provider in place, e.g. to rotate its credential"""
  updateProvider(input: UpdateProviderInput!): Provider!

  """Re-list the models a provider offers"""
  refreshProvider(input: RefreshProviderInput!): Provider!

  """Delete a provider and the models it offers"""
  deleteProvider(input: DeleteProviderInput!): ID!

  """Pull a model into an Ollama provider"""
  pull(input: PullInput!): OllamaPullResult!

  """Register a model as the caller's default for a kind of task"""
  useModelFor(input: UseModelForInput!): DefaultUse!

  """Send a chat completion request"""
  chat(input: ChatInput!): ChatResponse!

  """Generate an image from a text description"""
  generateImage(input: ImageInput!): ImageResponse!

  """Create a searchable collection of documents"""
  createCollection(input: ChromaCollectionInput!): ChromaCollection!

  """Create a collection, or update it if it already exists"""
  ensureCollection(input: ChromaCollectionInput!): ChromaCollection!

  """Delete a collection and its documents"""
  deleteCollection(input: DeleteCollectionInput!): ID!

  """Embed documents and add them to a collection"""
  addDocumentsToCollection(input: AddDocumentsToCollectionInput!): [Document!]!
}

input OffsetPaginationInput {
  offset: Int! = 0
