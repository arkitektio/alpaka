"""The root mutation type"""
type Mutation {
  """Create an empty collaboration, to put rooms in and grant a guest"""
  createCollaboration(input: CreateCollaborationInput!): Collaboration! @auth(any_role_of: ["admin", "editor"])

  """
  Put a room or a message in a collaboration, with what it needs to be seen: a room comes with its agents and messages
  """
  addToCollaboration(input: CollaborationObjectInput!): Collaboration! @auth(any_role_of: ["admin", "editor"])

  """
  Take a room or a message out of a collaboration, with what it brought that nothing else there needs
  """
  removeFromCollaboration(input: CollaborationObjectInput!): Collaboration! @auth(any_role_of: ["admin", "editor"])

  """
  Delete a collaboration: whoever was granted it sees nothing of it any more
  """
  deleteCollaboration(id: ID!): ID! @auth(any_role_of: ["admin", "editor"])

  """Open a new room"""
  createRoom(input: CreateRoomInput!): Room!

  """Delete a room and its messages"""
  deleteRoom(input: DeleteRoomInput!): ID!

  """Post a complete message into a room"""
  send(input: SendMessageInput!): Message! @auth(allow_scoped: true)

  """
  Open a message to stream text into. Only the starting agent (same user and client) can append to or finish it.
  """
  startMessage(input: StartMessageInput!): Message!

  """
  Append a delta to a streaming message. Batch deltas (every ~100-250 ms or ~30 characters) and await each call before sending the next, so they arrive in order.
  """
  appendMessage(input: AppendMessageInput!): Message!

  """
  Close a streaming message. Pass the full final text so any delta lost on the way is repaired; call it in a finally block so a crashed stream never stays open.
  """
  finishMessage(input: FinishMessageInput!): Message!

  """Configure a new LLM provider and list the models it offers"""
  createProvider(input: ProviderInput!): Provider!

  """Update a provider in place, e.g. to rotate its credential"""
  updateProvider(input: UpdateProviderInput!): Provider!

  """Re-list the models a provider offers"""
  refreshProvider(input: RefreshProviderInput!): Provider!

  """Delete a provider and the models it offers"""
  deleteProvider(input: DeleteProviderInput!): ID!

  """
  Pull a model into an Ollama provider, or a decision model into an Ollaya provider
  """
  pull(input: PullInput!): OllamaPullResult!

  """Register a model as the caller's default for a kind of task"""
  useModelFor(input: UseModelForInput!): DefaultUse!

  """
  Cap this organization's LLM consumption, optionally for one user and/or model
  """
  createBudget(input: CreateBudgetInput!): Budget!

  """Change a budget's period, limits or hardness"""
  updateBudget(input: UpdateBudgetInput!): Budget!

  """Remove a budget"""
  deleteBudget(input: DeleteBudgetInput!): ID!

  """Send a chat completion request"""
  chat(input: ChatInput!): ChatResponse!

  """Generate an image from a text description"""
  generateImage(input: ImageInput!): ImageResponse!

  """
  Ask a decision model typed questions (noul, choice, score) about one state, and get calibrated answers
  """
  decide(input: DecideInput!): Decision!

  """Create a searchable collection of documents"""
  createCollection(input: ChromaCollectionInput!): ChromaCollection!

  """Create a collection, or update it if it already exists"""
  ensureCollection(input: ChromaCollectionInput!): ChromaCollection!

  """Delete a collection and its documents"""
  deleteCollection(input: DeleteCollectionInput!): ID!

  """Embed documents and add them to a collection"""
  addDocumentsToCollection(input: AddDocumentsToCollectionInput!): [Document!]!

  """
  Remember something about the person who assigned the task, replacing the memory of that name. Needs the task's provenance token
  """
  remember(input: MemoryInput!): Memory!

  """Forget one of the assigner's memories by name; whether there was one"""
  forget(input: ForgetInput!): Boolean!
}

