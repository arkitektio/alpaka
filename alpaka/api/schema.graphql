  MISTRAL
  HUGGINGFACE
  OLLAMA
  AZURE
  AWS
  VERTEX_AI
  PALM
  REPLICATE
  TOGETHER_AI
  ANYSCALE
  FIREWORKS_AI
  DEEPINFRA
  PERPLEXITY
