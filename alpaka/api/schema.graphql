type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!

  """List the rooms in this organization"""
  rooms(filters: RoomFilter, ordering: [RoomOrder!]! = [], pagination: OffsetPaginationInput): [Room!]!

  """Aggregate statistics over this organization's rooms"""
  roomStats(filters: RoomFilter = null): RoomStats!

  """List the messages in this organization's rooms"""
  messages(filters: MessageFilter, ordering: [MessageOrder!]! = [], pagination: OffsetPaginationInput): [Message!]!

  """List the LLM providers configured for this organization"""
  providers(filters: ProviderFilter, ordering: [ProviderOrder!]! = [], pagination: OffsetPaginationInput): [Provider!]!

  """List the LLM models reachable through this organization's providers"""
  llmModels(filters: LLMModelFilter, ordering: [LLMModelOrder!]! = [], pagination: OffsetPaginationInput): [LLMModel!]!

  """The models the caller has registered as defaults"""
  defaultUses(filters: DefaultUseFilter, ordering: [DefaultUseOrder!]! = [], pagination: OffsetPaginationInput): [DefaultUse!]!

  """List this organization's Chroma collections"""
  chromaCollections(filters: ChromaCollectionFilter, ordering: [ChromaCollectionOrder!]! = [], pagination: OffsetPaginationInput): [ChromaCollection!]!

  """Get a single room by ID"""
  room(id: ID!): Room!

  """Get a single message by ID"""
  message(id: ID!): Message!

  """Get a single provider by ID"""
  provider(id: ID!): Provider!

  """Get a single LLM model by ID"""
  llmModel(id: ID!): LLMModel!

  """The model the caller uses by default for one kind of task, if any"""
  defaultModelFor(kind: DefaultKind!): LLMModel

  """Get a single Chroma collection by ID"""
  chromaCollection(id: ID!): ChromaCollection!

  """Search a collection for the documents most similar to some text"""
  documents(input: QueryInput!): [Document!]!
}

"""A similarity query against a collection"""
input QueryInput {
  collection: ID!
  queryTexts: [String!]!
  nResults: Int! = 3
  where: JSON = null
}

"""The provider whose model list should be re-synced"""
input RefreshProviderInput {
  id: ID!
}

"""A Release model to represent a release of an application in the system"""
type Release @key(fields: "id", resolvable: true) {
  id: ID!
  app: App!
