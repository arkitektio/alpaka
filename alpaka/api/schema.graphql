}

"""A room agents and users converse in"""
type Room @key(fields: "id", resolvable: true) {
  id: ID!

  """The Title of the Room"""
  title: String!
  description: String
  messages(filters: MessageFilter, ordering: [MessageOrder!]! = [], pagination: OffsetPaginationInput): [Message!]!
  agents(filters: AgentFilter, ordering: [AgentOrder!]! = [], pagination: OffsetPaginationInput): [Agent!]!

  """The organization this room belongs to"""
  organization: Organization!
  creator: User

  """The time this room got created"""
  createdAt: DateTime!
}

"""Something that happened in a room"""
type RoomEvent {
  message: Message
  join: Agent
  leave: Agent
}

"""Numeric/aggregatable fields of Room"""
enum RoomField {
  CREATED_AT
}

"""Room(id, title, description, creator, organization, created_at)"""
input RoomFilter {
  AND: RoomFilter
  OR: RoomFilter
  NOT: RoomFilter
  DISTINCT: Boolean
  ids: [ID!]
  search: String
  talkingAbout: StructureInput
}

input RoomOrder @oneOf {
  createdAt: Ordering
  title: Ordering
}

type RoomStats {
  """Total number of items in the selection"""
  count: Int!

  """Number of distinct values for the field"""
  distinctCount(field: RoomField!): Int!

  """Maximum"""
  max(field: RoomField!): Float

  """Minimum"""
  min(field: RoomField!): Float

  """Average"""
  avg(field: RoomField!): Float

  """Sum"""
  sum(field: RoomField!): Float

  """Time-bucketed stats over a datetime field."""
  series(field: RoomField!, timestampField: RoomTimestampField!, by: Granularity!): [TimeBucket!]!
}

"""Datetime fields of Room for bucketing"""
enum RoomTimestampField {
  CREATED_AT
}

"""The message to send"""
input SendMessageInput {
  room: ID!
  agentId: String!
