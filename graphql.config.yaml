projects:
  
  alpaka:
    # The SDL exported from the server tree (alpaka-server's alpaka_server.schema),
    # not a running deployment: codegen has to be reproducible, and pointing at a
    # live server generated against whatever happened to be deployed. Refresh with
    #   uv run --project <alpaka-server> python -c \
    #     "import django; django.setup(); from alpaka_server.schema import schema; print(schema)"
    schema: schema.graphql
    documents: graphql/**/**.graphql
    extensions:
      turms:
        out_dir: alpaka/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          enabled: true
          populate_by_name: true
          alias_mode: split
          use_enum_values: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of AlpakaApi, which Alpaka mixes in.
            # Each method hands its operation to execute/aexecute/subscribe/asubscribe
            # of self, which Alpaka itself implements over its rath.
            client_class: AlpakaApi
            # The client's own attributes: pydantic lets a field hide a method.
            reserved_from:
              - alpaka.alpaka.Alpaka
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          JSON: typing.Any
          ID: rath.scalars.ID
          Base64EncodedString: str
        additional_bases:
          ChatResponse:
            - alpaka.traits.ChatResponseTraits
  